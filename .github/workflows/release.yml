name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.0.1, etc.

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Decode Windows certificate
        if: env.WIN_CSC_LINK != ''
        shell: powershell
        run: |
          $certBytes = [Convert]::FromBase64String($env:WIN_CSC_LINK)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\build\certs\certificate.pfx", $certBytes)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_LINK: ${{ github.workspace }}\build\certs\certificate.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 5

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Decode macOS certificate
        if: env.MAC_CSC_LINK != ''
        run: |
          echo "$MAC_CSC_LINK" | base64 --decode > $GITHUB_WORKSPACE/build/certs/certificate.p12
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Build macOS installer
        run: npm run build:mac
        env:
          CSC_LINK: ${{ github.workspace }}/build/certs/certificate.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ github.ref }}^ 2>/dev/null || echo "")

          # Generate changelog from commits
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..${{ github.ref }} --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Escape for GitHub Actions
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Installation Instructions

            ### Windows
            1. Download `Reviewer-2-Setup-*.exe`
            2. Run the installer
            3. **Note:** You may see a "Windows protected your PC" warning (SmartScreen). Click "More info" → "Run anyway"
            4. Follow the installation wizard

            ### macOS
            1. Download `Reviewer-2-*.dmg`
            2. Open the DMG and drag the app to Applications
            3. **Note:** First launch requires right-click → Open (or run `xattr -cr "/Applications/Reviewer 2.app"` in Terminal)
            4. For subsequent launches, double-click normally

            ### Auto-Update
            - **Windows:** Auto-update is fully supported. The app will check for updates on launch.
            - **macOS:** Due to lack of Apple notarization (requires paid Apple Developer account), auto-update is not available. Download new versions manually from this page.

            ## Checksums

            See attached files for SHA256 checksums.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
