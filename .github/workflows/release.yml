name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: "Version to prepare, without v (example: 1.2.0)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-as: ${{ inputs.release_as }}

  test:
    name: Test release candidate
    if: needs.prepare.outputs.release_created == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: xvfb-run -a npm test

  build-windows:
    name: Build Windows x64
    if: needs.prepare.outputs.release_created == 'true'
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  build-macos:
    name: Build macOS universal
    if: needs.prepare.outputs.release_created == 'true'
    needs: [prepare, test]
    runs-on: macos-latest
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned app
        if: env.MAC_CSC_LINK == '' || env.APPLE_ID == '' || env.APPLE_APP_SPECIFIC_PASSWORD == '' || env.APPLE_TEAM_ID == ''
        run: npm run build:mac -- --universal --publish never --config.mac.hardenedRuntime=false --config.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build, sign and notarize app
        if: env.MAC_CSC_LINK != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: npm run build:mac -- --universal --publish never --config.mac.notarize=true
        env:
          CSC_LINK: ${{ env.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.MAC_CSC_KEY_PASSWORD }}

      - name: Upload macOS release files
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml

  publish:
    name: Publish GitHub release
    if: needs.prepare.outputs.release_created == 'true'
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Attach files to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
