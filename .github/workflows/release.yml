name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Read release metadata
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(
        github.event.pull_request.head.ref,
        'release-please--branches--main--components--'
      )
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ github.event.pull_request.merge_commit_sha }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout merged release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate and export version
        id: version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          manifest_version=$(node -p "require('./.release-please-manifest.json')['.']")

          if [[ "$package_version" != "$manifest_version" ]]; then
            echo "package.json version ($package_version) does not match manifest ($manifest_version)" >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$package_version" >> "$GITHUB_OUTPUT"

  test:
    name: Test release candidate
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: xvfb-run -a npm test

  build-windows:
    name: Build Windows x64
    needs: [metadata, test]
    runs-on: windows-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  build-macos:
    name: Build macOS universal
    needs: [metadata, test]
    runs-on: macos-latest
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned app
        if: env.MAC_CSC_LINK == '' || env.APPLE_ID == '' || env.APPLE_APP_SPECIFIC_PASSWORD == '' || env.APPLE_TEAM_ID == ''
        run: npm run build:mac -- --universal --publish never --config.mac.hardenedRuntime=false --config.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build, sign and notarize app
        if: env.MAC_CSC_LINK != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: npm run build:mac -- --universal --publish never --config.mac.notarize=true
        env:
          CSC_LINK: ${{ env.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.MAC_CSC_KEY_PASSWORD }}

      - name: Upload unsigned macOS release files
        if: env.MAC_CSC_LINK == '' || env.APPLE_ID == '' || env.APPLE_APP_SPECIFIC_PASSWORD == '' || env.APPLE_TEAM_ID == ''
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap

      - name: Upload signed macOS release files
        if: env.MAC_CSC_LINK != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml

  publish:
    name: Publish GitHub release
    needs: [metadata, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create draft release without opening another pull request
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          skip-github-pull-request: true

      - name: Attach files to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.metadata.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.metadata.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
